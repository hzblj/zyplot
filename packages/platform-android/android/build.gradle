plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

group = 'com.hzblj.zyplot'
version = '0.0.0'

apply from: project(":expo-modules-core").projectDir.getPath() + "/ExpoModulesCorePlugin.gradle"
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "com.hzblj.zyplot"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
  }
}

