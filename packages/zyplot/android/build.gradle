buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.1.20"
  }
}

plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

dependencies {
  implementation "androidx.compose.animation:animation:1.7.6"
  implementation "androidx.compose.foundation:foundation:1.7.6"
  implementation "androidx.compose.material3:material3:1.3.1"
  implementation "androidx.compose.runtime:runtime:1.7.6"
  implementation "androidx.compose.ui:ui:1.7.6"
}

group = 'com.hzblj.zyplot'
version = '0.0.0'

apply from: project(":expo-modules-core").projectDir.getPath() + "/ExpoModulesCorePlugin.gradle"
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "com.hzblj.zyplot"
  compileSdkVersion rootProject.ext.compileSdkVersion
  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "0.0.0"
  }
}
