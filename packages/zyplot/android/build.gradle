buildscript {
  // The Compose compiler plugin ships in lockstep with Kotlin, so it has to track the version the
  // host project builds with. `expo-root-project` publishes that as `kotlinVersion`.
  def composeCompilerVersion = rootProject.ext.has("kotlinVersion")
    ? rootProject.ext.get("kotlinVersion")
    : "2.1.20"

  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$composeCompilerVersion"
  }
}

plugins {
  id 'com.android.library'
  // Applies kotlin-android, the core dependency, publishing, and — from SDK 57 on — the Pika
  // compiler plugin the Compose `View` and `Prop` definitions are inlined against. Compiling
  // without it leaves those calls as stubs that throw the moment the module registers.
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.hzblj.zyplot'
version = '0.0.0'

android {
  namespace "com.hzblj.zyplot"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation "androidx.compose.animation:animation:1.7.6"
  implementation "androidx.compose.foundation:foundation:1.7.6"
  implementation "androidx.compose.material3:material3:1.3.1"
  implementation "androidx.compose.runtime:runtime:1.7.6"
  implementation "androidx.compose.ui:ui:1.7.6"
}
