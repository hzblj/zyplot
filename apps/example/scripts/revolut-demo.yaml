appId: com.hzblj.zyplot.example
---
- extendedWaitUntil:
    visible: 'Stock detail'
    timeout: 300000
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: 'Stock detail'
- extendedWaitUntil:
    visible: 'TSLA · Tesla'
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: '${SCRUB_RIGHT}, ${CHART_MID_Y}'
    end: '${SCRUB_LEFT}, ${CHART_MID_Y}'
    duration: 3400
- waitForAnimationToEnd:
    timeout: 1200

- tapOn: '1W'
- waitForAnimationToEnd:
    timeout: 2500
- swipe:
    start: '${SCRUB_RIGHT}, ${CHART_MID_Y}'
    end: '${SCRUB_LEFT}, ${CHART_MID_Y}'
    duration: 3000

- swipe:
    start: '${EVENT_X}, ${HOLD_TOP}'
    end: '${EVENT_X}, ${HOLD_BOTTOM}'
    duration: 4000
- waitForAnimationToEnd:
    timeout: 1000

- tapOn: '1M'
- waitForAnimationToEnd:
    timeout: 1800
- tapOn: '6M'
- waitForAnimationToEnd:
    timeout: 1800
- tapOn: '1Y'
- waitForAnimationToEnd:
    timeout: 1800
- tapOn: '5Y'
- waitForAnimationToEnd:
    timeout: 1800
- tapOn: 'Max'
- waitForAnimationToEnd:
    timeout: 2200

- tapOn: '1M'
- waitForAnimationToEnd:
    timeout: 1800
- tapOn:
    point: '${TOGGLE_X}, ${TOGGLE_Y}'
- waitForAnimationToEnd:
    timeout: 2500

- swipe:
    start: '${SCRUB_RIGHT}, ${CHART_MID_Y}'
    end: '${SCRUB_LEFT}, ${CHART_MID_Y}'
    duration: 3000
- swipe:
    start: '${CANDLE_X}, ${HOLD_TOP}'
    end: '${CANDLE_X}, ${HOLD_BOTTOM}'
    duration: 3500
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    point: '${TOGGLE_X}, ${TOGGLE_Y}'
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    point: '${BACK_X}, ${BACK_Y}'
- waitForAnimationToEnd:
    timeout: 2000
